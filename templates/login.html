<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>14PEAKS Beta Access</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #101112;
      color: #f5f1e8;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        linear-gradient(135deg, rgba(96, 165, 250, 0.08), transparent 34%),
        linear-gradient(315deg, rgba(249, 115, 22, 0.12), transparent 38%),
        #101112;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      background:
        repeating-linear-gradient(0deg, rgba(255,255,255,0.026) 0 1px, transparent 1px 82px),
        repeating-linear-gradient(90deg, rgba(255,255,255,0.022) 0 1px, transparent 1px 82px);
      animation: backgroundDrift 18s linear infinite;
    }

    @keyframes backgroundDrift {
      from { transform: translate3d(0, 0, 0); }
      to { transform: translate3d(-82px, -82px, 0); }
    }

    .login-card {
      width: min(460px, 100%);
      border: 1px solid #333739;
      border-radius: 8px;
      padding: 28px;
      background: rgba(23, 25, 26, 0.92);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.34);
      backdrop-filter: blur(10px);
    }

    .kicker {
      margin: 0 0 8px;
      color: #f97316;
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 42px;
      line-height: 0.96;
      letter-spacing: 0;
    }

    p {
      margin: 0 0 18px;
      color: #c7c1b6;
      line-height: 1.5;
    }

    label {
      display: block;
      margin: 0 0 6px;
      color: #d8d2c8;
      font-size: 13px;
    }

    input {
      width: 100%;
      border: 1px solid #3a3f42;
      border-radius: 6px;
      padding: 12px;
      background: #101112;
      color: #f5f1e8;
      font: inherit;
    }

    button {
      width: 100%;
      min-height: 44px;
      border: 0;
      border-radius: 6px;
      margin-top: 16px;
      background: #f97316;
      color: #130b05;
      font-weight: 800;
      cursor: pointer;
    }

    .error {
      margin: 14px 0 0;
      color: #fed7aa;
    }
  </style>
</head>
<body>
  <main class="login-card">
    <div class="kicker">Beta access</div>
    <h1>14PEAKS Route Visualizer</h1>
    <p>Enter the beta password to access route processing.</p>

    <form method="post" action="/login">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      <button type="submit">Enter</button>
    </form>

    {% if error %}
      <p class="error">{{ error }}</p>
    {% endif %}
  </main>
</body>
</html>
